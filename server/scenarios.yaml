# Market Panic — Pre-built Event Scenarios
# Each scenario is a list of events with round_offset relative to injection time.

flash_crash:
  - headline: "BREAKING: Algorithmic trading glitch triggers market-wide sell-off"
    category: panic
    affected_tickers: ["ALL"]
    severity: 5
    is_true: true
    duration_rounds: 4
    round_offset: 0
  - headline: "Trading halted briefly — circuit breakers triggered across exchanges"
    category: panic
    affected_tickers: ["ALL"]
    severity: 3
    is_true: true
    duration_rounds: 2
    round_offset: 1
  - headline: "Federal Reserve issues emergency statement: 'Markets are functioning normally'"
    category: recovery
    affected_tickers: ["ALL"]
    severity: 3
    is_true: true
    duration_rounds: 3
    round_offset: 3

